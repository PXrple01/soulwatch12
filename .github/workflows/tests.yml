# Startet die Watchlist bei jedem Push in einem Browser und prüft die wichtigsten Abläufe (Ordner tests/).
# Schlägt ein Test fehl, wird der Lauf rot; Bildschirmfotos der Fehler liegen dann unter „Artifacts“.
name: Tests

on:
  push:
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node run.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fehlerbilder
          path: tests/out
          if-no-files-found: ignore
